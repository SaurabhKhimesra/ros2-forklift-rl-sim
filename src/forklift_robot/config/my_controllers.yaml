# ros2_control configuration for the forklift.
#
# These three controllers are the only drive path: there is deliberately no
# gazebo_ros_diff_drive plugin in the URDF, because two controllers writing the
# same wheel joints fight each other and both publish /odom.

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz; must be >= the env's control_hz (default 10 Hz)
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster
    fork_joint_controller:
      type: forward_command_controller/ForwardCommandController

fork_joint_controller:
  ros__parameters:
    joints: [fork_base_joint]
    interface_name: velocity

diff_cont:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link

    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # Must match the URDF: distance between the wheel centres, and the wheel
    # radius. Getting either wrong makes commanded and actual velocity disagree,
    # which shows up as a policy that works in the fast sim and drifts in Gazebo.
    wheel_separation: 1.115   # = chassis_bottom_width in forklift.urdf.xacro
    wheel_radius: 0.05        # = front_wheel_radius in forklift.urdf.xacro
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    open_loop: false
    position_feedback: true
    use_stamped_vel: false    # the env publishes plain geometry_msgs/Twist

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Acceleration limits mirror RobotConfig.max_*_accel in the env config, so
    # the simulated drivetrain cannot follow a command the real one could not.
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 2.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 4.0
